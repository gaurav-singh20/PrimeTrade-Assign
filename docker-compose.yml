services:
  backend:
    image: primetrade-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: primetrade-backend
    ports:
      - "5001:5000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=5000
    restart: unless-stopped

  frontend:
    image: primetrade-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: primetrade-frontend
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    restart: unless-stopped
